name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # Do not pass empty APPLE_* secrets — they override ad-hoc signingIdentity "-".
      - name: Build Tauri app
        run: pnpm tauri build --bundles app,dmg

      - name: Package .app as zip
        run: |
          set -euo pipefail
          APP="src-tauri/target/release/bundle/macos/IM Review.app"
          test -d "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "src-tauri/target/release/bundle/macos/IM-Review.app.zip"
          ls -lh src-tauri/target/release/bundle/dmg/*.dmg \
            "src-tauri/target/release/bundle/macos/IM-Review.app.zip"

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          name: IM Review ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
          draft: true
          prerelease: ${{ github.ref_type != 'tag' }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/IM-Review.app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
